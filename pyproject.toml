[project]
name = "currencies"
version = "0.1.0"
description = ""
authors = [
    {name = "Mariya Kuznetsova",email = "kuznetsova19.m@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "litestar (>=2.16.0,<3.0.0)",
    "sqlalchemy (>=2.0.42,<3.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "alembic (>=1.16.4,<2.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "advanced-alchemy (>=1.4.5,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "aiohttp (>=3.12.15,<4.0.0)",
    "faststream[rabbit] (>=0.5.48,<0.6.0)",
    "taskiq-faststream (>=0.2.3,<0.3.0)",
    "aiokafka (>=0.12.0,<0.13.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
line_length = 100
