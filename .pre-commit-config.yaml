repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        types: [python]
        exclude: ^migrations/
      - id: end-of-file-fixer
        types: [python]
        exclude: ^migrations/
      - id: debug-statements
        types: [python]
      - id: mixed-line-ending
        args: [ '--fix=lf' ]
        description: Forces to replace line ending by the UNIX 'lf' character.
        types: [python]
        exclude: ^migrations/
      - id: check-merge-conflict
        types: [python]
        exclude: ^migrations/
      - id: check-ast
        types: [python]

  - repo: https://github.com/psf/black
    rev: '23.7.0'
    hooks:
    - id: black
      types: [python]
      args: [-l, '100']
      exclude: ^migrations/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        exclude: ^migrations/
        args: [
          "--select=T201",
          "--select=TID252",
          "--per-file-ignores=__init__.py:F401",
          "--per-file-ignores=__init__.py:TID252",
        ]

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.0
    hooks:
      - id: isort
        types: [python]
        exclude: ^migrations/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect secrets

  - repo: https://github.com/PyCQA/autoflake
    rev: v1.7.7
    hooks:
      - id: autoflake
        name: autoflake except __init__.py
        args: [--remove-all-unused-imports, --remove-unused-variables, --in-place]
        types: [python]
        exclude: ^migrations/|__init__\.py$

      - id: autoflake
        name: autoflake __init__.py safe
        args: [--remove-unused-variables, --in-place]
        types: [python]
        files: __init__\.py$
        exclude: ^migrations/
