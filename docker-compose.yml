services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - ./entrypoint.sh
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - backend_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NUXT_API_URL: http://backend:8000
      NUXT_PUBLIC_API_URL: /backend
    depends_on:
      - backend
    networks:
      - backend_network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - backend_network

  db:
    image: postgres:17
    restart: always
    ports:
      - "5001:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 10s
      timeout: 20s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend_network
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 30s
      timeout: 30s
      retries: 10


  taskiq-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      taskiq scheduler src.config.taskiq:scheduler
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "22181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - backend_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - backend_network
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "9092" ]
      interval: 5s
      timeout: 10s
      retries: 12

  faust:
    build:
      context: .
      dockerfile: faust/faust.Dockerfile
    command: >
      faust -A src.app:faust_app worker -l info
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend_network

  grafana-agent:
    image: grafana/agent:v0.38.1
    volumes:
      - ./grafana-agent.yaml:/etc/agent/agent.yaml
      - ./grafana-wal:/tmp/grafana-agent-wal
    command:
      - "--config.file=/etc/agent/agent.yaml"
    depends_on:
      - backend
    networks:
      - backend_network

  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    depends_on:
      - db_sonar
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db_sonar:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    networks:
      - backend_network

  db_sonar:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_DB=sonarqube
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
    volumes:
      - db_sonar_data:/var/lib/postgresql/data
    networks:
      - backend_network


volumes:
  db_data:
  db_sonar_data:
  rabbitmq_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  backend_network:
    driver: bridge