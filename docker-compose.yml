services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - ./entrypoint.sh
    depends_on:
      - db
      - rabbitmq
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - backend_network

  db:
    image: postgres:17
    restart: always
    ports:
      - "5001:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend_network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend_network

volumes:
  db_data:
  rabbitmq_data:

networks:
  backend_network:
    driver: bridge